<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1428">
<title>NEON ARCADE · 掌上游乐场</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:#070d1b}body{margin:0;color:#eef7ff;background:radial-gradient(ellipse at 50% -10%,#25365d 0,#101d38 36%,#070d1b 80%);min-height:100dvh}
main{max-width:600px;margin:0 auto;padding:max(27px,env(safe-area-inset-top)) 20px max(35px,env(safe-area-inset-bottom))}
.overline{font-size:12px;letter-spacing:3px;color:#65eaff;font-weight:800}.header{margin:34px 0 32px}.header h1{margin:8px 0 8px;font-size:clamp(36px,10vw,54px);font-weight:950;letter-spacing:-1.5px;line-height:1.1}.header h1 span{color:#ff79bf}.header p{color:#a5bbd5;font-size:14px;line-height:1.8;margin:0}
.grid{display:grid;gap:18px}.card{background:linear-gradient(130deg,#172746,#0e1830);border:1px solid #34476c;border-radius:21px;overflow:hidden;box-shadow:0 12px 25px #060b1926}.art{height:138px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.art.tetris{background:radial-gradient(circle at 60% 40%,#30326e,#171b3a 65%,#12182d)}.art.breakout{background:radial-gradient(circle at 60% 30%,#214b69,#102e49 65%,#0b172c)}.bricks{display:grid;grid-template-columns:repeat(4,34px);grid-auto-rows:34px;gap:5px;transform:rotate(-9deg);filter:drop-shadow(0 0 12px #799afa66)}.bricks i{display:block;border-radius:5px;box-shadow:inset 0 4px #ffffff55,inset 0 -4px #00000033;background:#63eaff}.bricks i:nth-child(3n){background:#ff78ba}.bricks i:nth-child(4n){background:#ffcc73}.bricks i:nth-child(5n){background:#74f4ad}.art.breakout .tile{position:absolute;height:16px;width:54px;border-radius:5px;box-shadow:0 0 10px currentColor,inset 0 3px #ffffff66}.art.breakout .paddle{position:absolute;bottom:25px;left:38%;width:100px;height:13px;background:#6feafa;border-radius:12px;box-shadow:0 0 22px #68eff9}.art.breakout .ball{position:absolute;left:52%;bottom:56px;width:14px;height:14px;border-radius:50%;background:white;box-shadow:0 0 17px #8ee9ff}
.body{padding:19px}.body h2{font-size:23px;margin:0 0 5px}.body p{font-size:13px;color:#acbed9;margin:0 0 18px;line-height:1.7}a.play{display:block;text-align:center;text-decoration:none;color:#061525;background:linear-gradient(110deg,#6feafe,#93a9ff);font-weight:900;border-radius:12px;padding:14px;font-size:15px;touch-action:manipulation}a.play:focus-visible{outline:3px solid #ffcc66;outline-offset:3px}.footer{margin-top:26px;color:#8296b3;font-size:12px;text-align:center;line-height:1.8}
</style>
</head>
<body><main>
<header class="header"><div class="overline">◆ MOBILE ARCADE / 2026</div><h1>NEON <span>ARCADE</span></h1><p>无需安装。选择游戏，在 Safari 里全屏畅玩。<br>触屏优先设计，适配 iPhone 竖屏。</p></header>
<div class="grid">
  <section class="card"><div class="art tetris" aria-hidden="true"><div class="bricks"><i></i><i></i><i></i><i style="opacity:.3"></i><i style="opacity:.25"></i><i></i><i></i><i></i><i></i><i></i><i style="opacity:.3"></i><i></i></div></div><div class="body"><h2>NEON OVERDRIVE</h2><p>自动开挂方块 · 磁力补线 · 银河直条雨 · 自动激光与核爆</p><a class="play" href="tetris.html">▶ 开始超载方块</a></div></section>
  <section class="card"><div class="art breakout" aria-hidden="true"><div class="tile" style="top:25px;left:16%;background:#ff65b1;color:#ff65b1"></div><div class="tile" style="top:25px;left:43%;background:#ffd06f;color:#ffd06f"></div><div class="tile" style="top:25px;left:70%;background:#ff65b1;color:#ff65b1"></div><div class="tile" style="top:50px;left:25%;background:#69f5b8;color:#69f5b8"></div><div class="tile" style="top:50px;left:55%;background:#5fc9ff;color:#5fc9ff"></div><div class="ball"></div><div class="paddle"></div></div><div class="body"><h2>BREAKOUT INFINITY</h2><p>无限弹球战场 · 自动再生砖墙 · 时空门轰炸 · 飞船逐级护航</p><a class="play" href="breakout.html">▶ 开始无限打砖块</a></div></section>
</div>
<footer class="footer">纯静态 HTML + JavaScript · 无广告 · 无账号要求<br>游戏成绩只保留在当前页面会话中</footer>
</main></body></html>
