<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8f4ed">
<title>Peel Club · 撕胶带</title>
<style>
:root{--ink:#30424e;--muted:#75838b;--bg:#f8f4ed;--paper:#fffdf9;--ring:#e9e2d7;--accent:#426d72;--accent2:#a9d2ca}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
body{display:flex;justify-content:center;overflow-x:hidden}
.game{width:min(100%,510px);min-height:100svh;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse 90% 45% at 50% 34%,#fffefc 0%,#f9f6f0 72%,#f7f3ec 100%);box-shadow:0 0 70px #4b493a10;padding:16px 19px max(18px,env(safe-area-inset-bottom));gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:12px;font-weight:900;letter-spacing:3.6px;color:#416b72;display:flex;align-items:center;gap:7px}
.brand:before{content:"◉";font-size:20px;color:#f1ad72}
.levelpill{border:1px solid #e8e0d5;background:#fffdfa;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:800;color:#65747b;box-shadow:0 3px 10px #46342108}
.heading{text-align:center;display:flex;flex-direction:column;gap:5px;margin-top:3px}
h1{font-size:clamp(25px,6vw,32px);font-weight:900;letter-spacing:1.1px;line-height:1.25;margin:0}
.subtitle{font-size:12px;line-height:1.5;color:#7a898d}
.progress{display:flex;gap:5px;height:5px;width:min(100%,300px);margin:6px auto 0}
.progress i{flex:1;border-radius:5px;background:#e7e2d9;transition:background .25s}
.progress i.done{background:#9dc7bb}
.sceneWrap{position:relative;isolation:isolate;flex:0 0 auto;height:clamp(285px,44svh,510px);min-height:270px;max-height:520px;border-radius:27px;background:radial-gradient(ellipse at 50% 47%,#fffefa 0%,#f9f6ef 68%,#f1ece1 100%);border:1px solid #ebe5da;overflow:hidden;touch-action:none;box-shadow:inset 0 5px 18px #b4a68d08}
.sceneWrap:after{position:absolute;content:"";inset:auto 18px 14px;pointer-events:none;border-top:1px dashed #d8d1c440}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
canvas:active{cursor:grabbing}
.sceneHint{position:absolute;z-index:1;bottom:23px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2px;color:#929a96;pointer-events:none}
.floating{position:absolute;right:13px;top:13px;display:flex;gap:6px}
.tiny{font-weight:800;font-size:11px;border:1px solid #e6dfd3;color:#7b827d;padding:7px 10px;border-radius:15px;background:#fffcf6cd;cursor:pointer}
.trayHeader{display:flex;align-items:center;justify-content:space-between;margin:0 1px;gap:5px}
.trayHeader b{font-size:14px;letter-spacing:.5px}
.trayHeader span{font-size:11px;color:#8c989a}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;background:#f2ede5;border:1px solid #e7ddce;border-radius:20px;padding:13px;box-shadow:inset 0 3px 6px #9e8d6b0b}
.slot{height:52px;border-radius:13px;background:#fffaf4;border:1px dashed #d8d1c6;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 2px 5px #aea08d0e;transition:transform .18s}
.slot .coil{width:34px;height:23px;border-radius:8px 8px 7px 7px;position:relative;transform:rotate(-12deg);box-shadow:1px 4px 5px #52524b21,inset 0 -5px 5px #1e384219,inset 0 5px 5px #ffffff59;animation:drop .24s cubic-bezier(.18,.7,.5,1.2) both}
.slot .coil:before{content:"";width:19px;height:14px;background:#f3f0e8;border:4px solid #ffffffa8;border-radius:50%;position:absolute;top:4px;left:8px;box-shadow:inset 0 1px 3px #746e6233}
.slot .coil:after{content:"";position:absolute;inset:3px 3px auto;border-top:1px solid #fff9}
@keyframes drop{from{transform:translateY(-14px) scale(.4) rotate(12deg);opacity:.3}to{transform:translateY(0) scale(1) rotate(-12deg);opacity:1}}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.action{background:#fffcf7;border:1px solid #e7e0d4;color:#5d7275;padding:12px 8px;border-radius:15px;font-family:inherit;font-weight:800;font-size:13px;box-shadow:0 3px 8px #4d48300c;cursor:pointer}
.action:active,.tiny:active{transform:scale(.96)}
.action:disabled{opacity:.37;cursor:default}
.footer{text-align:center;font-size:10px;color:#abb1ab;padding-top:1px}
.toast{position:absolute;z-index:4;left:50%;top:24%;transform:translate(-50%,-8px);background:#344c57e9;color:#fff;padding:10px 17px;border-radius:20px;box-shadow:0 12px 24px #344c5730;font-weight:800;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:absolute;z-index:6;inset:0;background:#35464c58;display:flex;align-items:center;justify-content:center;padding:25px;backdrop-filter:blur(5px)}
.modal[hidden]{display:none}
.modalCard{width:min(100%,355px);background:#fffdf8;padding:32px 24px 25px;border-radius:26px;text-align:center;box-shadow:0 25px 65px #2638393b}
.celebrate{font-size:54px;line-height:1.4}
.modalCard h2{margin:7px 0 8px;font-size:25px}
.modalCard p{color:#788589;font-size:13px;line-height:1.7;margin:0 0 22px}
.primary{border:0;border-radius:16px;padding:15px 22px;width:100%;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(135deg,#588b8d,#406d74);box-shadow:0 8px 17px #557f7e44;cursor:pointer}
.secondary{background:transparent;border:0;color:#889393;font-size:12px;margin-top:14px;cursor:pointer;padding:6px}
@media(min-height:790px){.game{gap:15px;padding-top:24px}.sceneWrap{min-height:350px}.slot{height:56px}}
@media(max-height:670px){.game{gap:8px;padding-top:10px}.sceneWrap{height:252px;min-height:245px}.heading{gap:2px}.sceneHint{bottom:12px}.slot{height:43px}.tray{padding:10px}.action{padding:9px 4px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="game" id="game">
  <header><div class="brand">PEEL CLUB</div><div class="levelpill" id="levelPill">LEVEL 01</div></header>
  <div class="heading"><h1 id="patternTitle">胶带图案</h1><div class="subtitle" id="subtitle">从最上层开始撕 · 同色三卷自动消除</div><div class="progress" id="progress"></div></div>
  <section class="sceneWrap" id="sceneWrap" aria-label="可旋转纸盒与彩色胶带"><canvas id="scene" aria-label="触摸胶带撕开，拖动旋转纸盒"></canvas><div class="floating"><button class="tiny" id="soundBtn" title="切换音效">♫ 开</button></div><div class="sceneHint">轻点胶带撕开　·　拖动纸盒旋转视角</div><div class="toast" id="toast"></div></section>
  <div class="trayHeader"><b>胶带收纳盒 <span id="counter">0 / 5</span></b><span>凑齐 3 个同色即可腾出位置</span></div>
  <div class="tray" id="tray" aria-label="五格胶带收纳槽"></div>
  <div class="actions"><button id="hintBtn" class="action">✦ 提示</button><button id="undoBtn" class="action">↶ 撤销</button><button id="resetBtn" class="action">⟲ 重玩</button></div>
  <div class="footer">一个无需下载、可离线游玩的原创小游戏</div>
  <div class="modal" id="modal" hidden><div class="modalCard"><div class="celebrate" id="modalIcon">🎉</div><h2 id="modalTitle">拆包成功！</h2><p id="modalDesc"></p><button id="nextBtn" class="primary">下一盒 →</button><button id="modalReset" class="secondary">再玩一次</button></div></div>
</main>
<script>

(() => {
 'use strict';
 const $=id=>document.getElementById(id), canvas=$('scene'), wrap=$('sceneWrap'), ctx=canvas.getContext('2d');
 const PALETTE=['#f47e87','#64b7bb','#f6bd63','#8ca9e8','#a68bc8','#80bd9d','#ea9b68','#c887b3'];
 const FACE=[{axis:2,sgn:-1},{axis:0,sgn:-1},{axis:1,sgn:-1},{axis:0,sgn:1},{axis:1,sgn:1},{axis:2,sgn:1}];
 const RGB=(hex)=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
 function tint(hex,amt){const a=RGB(hex).map(v=>Math.max(0,Math.min(255,Math.round(v+(amt>0?255-v:-v)*Math.abs(amt)))));return `rgb(${a.join(',')})`}
 let W=400,H=400,DPR=1,boxScale=110,yaw=-.55,pitch=.34,level=1,pieces=[],tray=[],hist=[],anim=null,overlays=false,hits=[],hintId=null,hintUntil=0,sparkle=[],now=0,drag=null,sound=true,audio=null,toastTimer=0,currentLevelDef=null;
 try{level=Math.max(1,Math.min(99,Number(localStorage.getItem('peelclub_pattern_level')||1)||1))}catch(e){}
 function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
 function save(){try{localStorage.setItem('peelclub_pattern_level',String(level))}catch(e){}}
 function spawn(sx,sy,c,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=.55+Math.random()*2.6;sparkle.push({x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.0,life:1,col:c,r:2+Math.random()*3})}}
 function clone(o){return JSON.parse(JSON.stringify(o))}
 function fkey(face){return `${face.axis}:${face.sgn}`}
 function seg(face,along,cross,from,to,width,ci,layer){return {faceAxis:face.axis,faceSgn:face.sgn,along:along==='h'?'u':'v',cross,from,to,width,ci,layer}}
 const FRONT={axis:2,sgn:1}, RIGHT={axis:0,sgn:1}, TOP={axis:1,sgn:1};
 const LEVELS=[
  {title:'爱心礼盒', subtitle:'爱心主图案 + 盒盖蝴蝶结 + 侧面丝带', hint:'先收集盒盖蝴蝶结，再拆正面的爱心', pieces:[
   seg(FRONT,'h',.50,-.46,-.10,.21,0,36),seg(FRONT,'h',.50,.10,.46,.21,0,35),seg(FRONT,'h',.22,-.58,.58,.23,0,34),
   seg(TOP,'h',-.22,-.58,-.12,.18,4,30),seg(TOP,'h',-.22,.12,.58,.18,4,29),seg(TOP,'h',0.00,-.11,.11,.17,4,28),
   seg(RIGHT,'v',-.38,-.78,.20,.17,6,24),seg(RIGHT,'v',.04,-.68,.26,.17,6,23),seg(RIGHT,'h',-.58,-.16,.18,.15,6,22),
   seg(FRONT,'h',-.18,-.72,-.46,.12,1,18),seg(FRONT,'h',-.18,.46,.72,.12,1,17),seg(RIGHT,'h',.42,-.22,.22,.13,1,16)
  ]},
  {title:'星星礼盒', subtitle:'大星星 + 盒盖小星群 + 侧面流星尾迹', hint:'先从盒盖的小星星开始，会更容易腾位', pieces:[
   seg(FRONT,'h',.66,-.12,.12,.19,2,36),seg(FRONT,'h',.42,-.54,.54,.22,2,35),seg(FRONT,'h',.10,-.24,.24,.16,2,34),
   seg(FRONT,'h',-.10,-.74,.74,.20,6,30),seg(FRONT,'h',-.34,-.38,.38,.18,6,29),seg(FRONT,'h',-.58,-.12,.12,.16,6,28),
   seg(TOP,'h',-.34,-.56,-.32,.12,3,24),seg(TOP,'h',-.02,-.10,.10,.12,3,23),seg(TOP,'h',.24,.30,.56,.12,3,22),
   seg(RIGHT,'v',-.56,-.78,-.12,.12,0,18),seg(RIGHT,'v',-.24,-.62,.06,.12,0,17),seg(RIGHT,'v',.04,-.46,.24,.12,0,16)
  ]},
  {title:'花束礼盒', subtitle:'花朵主体 + 顶面叶片 + 侧面藤蔓', hint:'花瓣优先，绿色叶片与藤蔓负责填满侧面', pieces:[
   seg(FRONT,'h',.58,-.22,.22,.23,7,36),seg(FRONT,'v',-.40,.18,.54,.22,7,35),seg(FRONT,'v',.40,.18,.54,.22,7,34),
   seg(FRONT,'v',-.40,-.10,.18,.22,4,30),seg(FRONT,'v',.40,-.10,.18,.22,4,29),seg(FRONT,'h',-.16,-.22,.22,.22,4,28),
   seg(TOP,'h',-.22,-.58,-.18,.14,5,24),seg(TOP,'h',.00,-.10,.10,.14,5,23),seg(TOP,'h',.22,.18,.58,.14,5,22),
   seg(RIGHT,'v',-.60,-.76,-.28,.14,1,18),seg(RIGHT,'v',-.24,-.42,.00,.14,1,17),seg(RIGHT,'v',.10,-.08,.28,.14,1,16)
  ]},
  {title:'笑脸礼盒', subtitle:'笑脸主图案 + 顶面小太阳 + 侧面表情符号', hint:'先拆眼睛和顶面的太阳，笑脸会更快成型', pieces:[
   seg(FRONT,'v',-.28,.20,.50,.17,3,36),seg(FRONT,'v',.28,.20,.50,.17,3,35),seg(FRONT,'h',.06,-.08,.08,.15,3,34),
   seg(FRONT,'h',.10,-.62,-.38,.16,0,30),seg(FRONT,'h',.10,.38,.62,.16,0,29),seg(FRONT,'h',.62,-.20,.20,.16,0,28),
   seg(TOP,'h',-.32,-.12,.12,.12,2,24),seg(TOP,'v',-.12,.06,.26,.11,2,23),seg(TOP,'v',.12,.06,.26,.11,2,22),
   seg(RIGHT,'h',.26,-.46,-.20,.12,6,18),seg(RIGHT,'h',.02,-.10,.10,.12,6,17),seg(RIGHT,'h',-.22,.20,.46,.12,6,16)
  ]},
  {title:'豪华礼盒', subtitle:'正面十字封带 + 盒盖蝴蝶结 + 右侧封条', hint:'这一关三面都有关键胶带，先从最显眼的上层开始', pieces:[
   seg(FRONT,'v',0,-.84,.84,.20,1,38),seg(FRONT,'h',0,-.76,.76,.20,1,37),seg(FRONT,'h',-.46,-.34,.34,.15,1,36),
   seg(TOP,'h',-.24,-.68,-.14,.18,5,32),seg(TOP,'h',-.24,.14,.68,.18,5,31),seg(TOP,'h',0.00,-.12,.12,.19,5,30),
   seg(TOP,'v',-.26,-.56,-.16,.16,0,26),seg(TOP,'v',.26,-.56,-.16,.16,0,25),seg(FRONT,'h',.54,-.46,.46,.16,0,24),
   seg(RIGHT,'v',-.48,-.78,.22,.15,2,20),seg(RIGHT,'v',-.08,-.62,.06,.15,2,19),seg(RIGHT,'v',.28,-.42,-.06,.15,2,18)
  ]}
 ];
 function localAxes(faceAxis){return [0,1,2].filter(a=>a!==faceAxis)}
 function faceEqual(a,b){return a.faceAxis===b.faceAxis&&a.faceSgn===b.faceSgn}
 function pieceRect(p){
  if(p.along==='u')return {u1:Math.min(p.from,p.to),u2:Math.max(p.from,p.to),v1:p.cross-p.width/2,v2:p.cross+p.width/2};
  return {u1:p.cross-p.width/2,u2:p.cross+p.width/2,v1:Math.min(p.from,p.to),v2:Math.max(p.from,p.to)};
 }
 function overlaps(a,b){if(!faceEqual(a,b))return false;const A=pieceRect(a),B=pieceRect(b);return !(A.u2<=B.u1+.001||B.u2<=A.u1+.001||A.v2<=B.v1+.001||B.v2<=A.v1+.001)}
 function blocked(p){return pieces.some(other=>!other.removed&&other.id!==p.id&&other.layer>p.layer&&overlaps(p,other))}
 function makeLevel(n){
  currentLevelDef=clone(LEVELS[(n-1)%LEVELS.length]);
  currentLevelDef.guide=currentLevelDef.pieces;
  pieces=currentLevelDef.pieces.map((p,i)=>({...p,id:i,color:PALETTE[p.ci],removed:false,reverse:i%2===1}));
  tray=[];hist=[];anim=null;hintId=null;sparkle=[];overlays=false;$('modal').hidden=true;
  yaw=currentLevelDef.title.includes('豪华礼盒')?-.80:-.74; pitch=currentLevelDef.title.includes('豪华礼盒')?.52:.44;
  $('levelPill').textContent='LEVEL '+String(n).padStart(2,'0');
  $('patternTitle').textContent=currentLevelDef.title;
  $('subtitle').textContent=currentLevelDef.subtitle;
  updateUI();
 }
 function updateUI(){
  const slots=$('tray');slots.replaceChildren();
  for(let i=0;i<5;i++){
   const slot=document.createElement('div');slot.className='slot';
   if(tray[i]!=null){const r=document.createElement('div');r.className='coil';r.style.background=PALETTE[tray[i]];slot.appendChild(r)}
   slots.appendChild(slot)
  }
  $('counter').textContent=`${tray.length} / 5`;$('undoBtn').disabled=!hist.length||!!anim;$('hintBtn').disabled=!!anim;
  const p=$('progress');p.replaceChildren();
  for(let i=0;i<pieces.length;i++){const e=document.createElement('i');if(i<pieces.filter(s=>s.removed).length)e.className='done';p.appendChild(e)}
 }
 function localPoint(p){const c=Math.cos(yaw),s=Math.sin(yaw),a=Math.cos(pitch),b=Math.sin(pitch);const x=p[0]*c+p[2]*s,z=-p[0]*s+p[2]*c;return [x,p[1]*a-z*b,p[1]*b+z*a]}
 function project(p){let [x,y,z]=localPoint(p);const per=5.7/(5.7-z);return {x:W*.5+x*boxScale*per,y:H*.49-y*boxScale*per,z}}
 function polyPath(points){ctx.beginPath();for(let i=0;i<points.length;i++)ctx[i===0?'moveTo':'lineTo'](points[i].x,points[i].y);ctx.closePath()}
 function normalVis(f){const q=[0,0,0];q[f.axis]=f.sgn;return localPoint(q)[2]}
 function makeFacePoints(f,off=1){const ids=[0,1,2].filter(a=>a!==f.axis),pts=[];for(const [u,v] of [[-1,-1],[1,-1],[1,1],[-1,1]]){let p=[0,0,0];p[f.axis]=f.sgn*off;p[ids[0]]=u;p[ids[1]]=v;pts.push(p)}return pts}
 function pointOnFace(faceAxis,faceSgn,u,v,lift=0){
  const ids=localAxes(faceAxis),p=[0,0,0];p[faceAxis]=faceSgn*(1.008+lift);p[ids[0]]=u;p[ids[1]]=v;return p;
 }
 function pieceQuad(piece,from,to,lift=0){
  const a=Math.min(from,to),b=Math.max(from,to),w=piece.width/2;
  if(b-a<.01)return null;
  const left=piece.along==='u'?a:piece.cross-w,right=piece.along==='u'?b:piece.cross+w;
  const top=piece.along==='u'?piece.cross+w:b,bottom=piece.along==='u'?piece.cross-w:a;
  const pts=[pointOnFace(piece.faceAxis,piece.faceSgn,left,bottom,lift),pointOnFace(piece.faceAxis,piece.faceSgn,right,bottom,lift),pointOnFace(piece.faceAxis,piece.faceSgn,right,top,lift),pointOnFace(piece.faceAxis,piece.faceSgn,left,top,lift)];
  return pts;
 }
 function pieceState(piece,progress=0){
  if(!anim||anim.id!==piece.id)return {attachedFrom:piece.from,attachedTo:piece.to,detach:false};
  const a=Math.min(piece.from,piece.to),b=Math.max(piece.from,piece.to),span=b-a;
  if(piece.reverse){const edge=b-span*progress;return {attachedFrom:a,attachedTo:edge,detach:true,contact:edge,free:b};}
  const edge=a+span*progress;return {attachedFrom:edge,attachedTo:b,detach:true,contact:edge,free:a};
 }
 function drawGuide(def){
  for(const p of def.guide||[]){
   const face={axis:p.faceAxis,sgn:p.faceSgn}; if(normalVis(face)<=.025)continue;
   const quad=pieceQuad(p,p.from,p.to,.001); if(!quad)continue; const ps=quad.map(project);
   ctx.save(); polyPath(ps); ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fill(); ctx.strokeStyle='rgba(122,137,141,.22)'; ctx.setLineDash([5,4]); ctx.lineWidth=1; ctx.stroke(); ctx.restore();
  }
 }
 function inside(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y+1e-9)+a.x))ins=!ins}return ins}
 function drawDetached(piece,state){
  const length=Math.abs(state.free-state.contact);
  if(length<.018)return;
  // Peel as a continuous translucent film outside its own box face.
  const steps=16,w=piece.width*.5;
  function vertex(i,side){
   const u=i/steps,s=state.contact+(state.free-state.contact)*u;
   const bulge=.012+.32*u*u*(3-2*u);
   const p=piece.along==='u'?pointOnFace(piece.faceAxis,piece.faceSgn,s,piece.cross+side*w*(1-.04*u),bulge):pointOnFace(piece.faceAxis,piece.faceSgn,piece.cross+side*w*(1-.04*u),s,bulge);
   return project(p)
  }
  const left=[],right=[];
  for(let i=0;i<=steps;i++){left.push(vertex(i,-1));right.push(vertex(i,1));}
  for(let i=0;i<steps;i++){
   const a=left[i],b=right[i],c=right[i+1],d=left[i+1],u=i/steps;
   ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();
   const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
   g.addColorStop(0,tint(piece.color,-.17));g.addColorStop(.2,tint(piece.color,.22));g.addColorStop(.75,piece.color);g.addColorStop(1,tint(piece.color,-.17));
   ctx.globalAlpha=.86-.16*u;ctx.fillStyle=g;ctx.fill();ctx.restore();
  }
  ctx.save();ctx.beginPath();ctx.moveTo(left[0].x,left[0].y);ctx.lineTo(right[0].x,right[0].y);

   ctx.strokeStyle='#f9edd72a'; ctx.lineWidth=.8; for(let i=0;i<14;i++){const y=(i/13)*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+5);ctx.stroke()} ctx.restore();

   drawGuide({guide:(currentLevelDef&&currentLevelDef.guide||[]).filter(g=>g.faceAxis===f.axis&&g.faceSgn===f.sgn)});
   const facePieces=pieces.filter(p=>!p.removed&&p.faceAxis===f.axis&&p.faceSgn===f.sgn).sort((a,b)=>a.layer-b.layer);

 function screenCenter(piece){const list=hits.filter(h=>h.piece.id===piece.id);if(!list.length)return {x:W*.5,y:H*.5};const q=list[list.length-1];return q.poly.reduce((a,p)=>({x:a.x+p.x/4,y:a.y+p.y/4}),{x:0,y:0})}
 function beginPeel(piece){if(overlays||anim||piece.removed)return; if(blocked(piece)){notify('这片胶带被压住了，先撕上层 ✦');play('no');return}
  hist.push({removed:pieces.map(s=>s.removed),tray:[...tray]}); if(hist.length>40)hist.shift(); anim={id:piece.id,t0:performance.now(),duration:560}; hintId=null; play('rip'); updateUI();
 }

 }
 function openModal(won){overlays=true; $('modalIcon').textContent=won?'🎉':'📦'; $('modalTitle').textContent=won?'拼图拆完啦！':'收纳盒装满了'; $('modalDesc').textContent=won?'你把胶带图案一片片拆开了。准备挑战下一份礼物吗？':(currentLevelDef&&currentLevelDef.hint)||'注意撕取顺序，凑齐三片相同颜色才能腾出空间。'; $('nextBtn').textContent=won?'下一关图案 →':'重新挑战 ↻'; $('nextBtn').onclick=()=>{if(won){level++;save()}makeLevel(level)}; $('modal').hidden=false; play(won?'win':'no')}

 function resize(){const r=canvas.getBoundingClientRect(); W=Math.max(250,r.width); H=Math.max(200,r.height); DPR=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.ceil(W*DPR); canvas.height=Math.ceil(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); boxScale=Math.min(W*.34,H*.32,149)}

 $('hintBtn').onclick=()=>{if(anim||overlays)return; const pick=pieces.filter(t=>!t.removed&&!blocked(t)).sort((a,b)=>b.layer-a.layer)[0]; if(!pick)return; hintId=pick.id; hintUntil=performance.now()+2200; const center=screenCenter(pick); spawn(center.x,center.y,pick.color,9); notify('发光的那片可以先撕 ✨')};
 $('undoBtn').onclick=()=>{if(!hist.length||anim)return; const last=hist.pop(); pieces.forEach((s,i)=>s.removed=last.removed[i]); tray=last.tray; overlays=false; $('modal').hidden=true; hintId=null; updateUI(); notify('撤销成功 ↶')};
 $('resetBtn').onclick=()=>makeLevel(level); $('modalReset').onclick=()=>makeLevel(level);
 $('soundBtn').onclick=()=>{sound=!sound; $('soundBtn').textContent=sound?'♫ 开':'♫ 关'; if(sound)play('tap')};
