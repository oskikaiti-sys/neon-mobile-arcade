 beat(at){const i=this.tick++;if(this.game==='breakout'){const step=i%8;if(step%2===0){this.tone(36,.12,'sine',.095,at,-15);this.noise(.04,.008,at,750)}if(step%4===2)this.noise(.11,.026,at,1300);this.noise(.025,.009,at,4600);return}if(at<this.duckUntil)return;const step=i%32,bar=Math.floor(i/16)%2,fast=60/this.tempo/2;if(step%4===0){this.tone(this.game==='tetris'?37:35,.15,'sine',.32,at,-18);this.noise(.035,.018,at,1100)}if(step%8===4)this.noise(.13,.12,at,1000);if(step%2===0)this.noise(.034,step%4===2?.054:.032,at,4500);if(step%4===0)this.tone(this.bass[Math.floor(step/4)%8],fast*2.65,'sawtooth',.055,at);let note=this.lead[step];if(this.fever&&note!==null&&step%4===0)note+=12;if(note!==null)this.tone(note,fast*(this.fever?.9:.73),'square',this.fever?.073:.052,at);if(step%8===0){const root=this.bass[Math.floor(step/4)%8]+12;this.tone(root+7,fast*5,'triangle',.029,at);this.tone(root+12,fast*5,'triangle',.025,at)}if(bar===1&&step%8===6)this.tone(this.bass[Math.floor(step/4)%8]+24,.11,'sine',.05,at)}

  switch(name){case'move':this.tone(76,.045,'sine',.035,at);break;
  case'rotate':this.tone(82,.075,'triangle',.080,at,3);break;
  case'hold':this.tone(72,.10,'triangle',.1,at,-4);this.tone(79,.14,'sine',.065,at+.07);break;

  case'wall':this.tone(79,.04,'sine',.065,at,-5);break;

  case'bomb':this.tone(50,.31,'sawtooth',.18,at,-26);this.noise(.20,.12,at,500);break;
  case'power':this.tone(81,.09,'square',.085,at);this.tone(88,.15,'triangle',.1,at+.08);break;

</script><script src="breakout-songbook.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),C=$('field'),g=C.getContext('2d'),W=360,H=540;
const colors=['#f27aaf','#ffb272','#ffe17b','#5ee8b9','#6dd4ff','#aa91ff','#da8aff'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rnd=(a,b)=>a+Math.random()*(b-a);
const fx=new ArcadeAudio('breakout');
const gates={x:180,y:275,r:23};
const bumpers=[{x:73,y:371,r:18},{x:287,y:371,r:18}];
const COLS=8,ROWS=6,MARGIN=11,GAP=4,BW=(W-MARGIN*2-GAP*(COLS-1))/COLS,BH=18;
let bricks=[],balls=[],shots=[],missiles=[],shards=[],drops=[],particles=[],rings=[],notices=[];
let songbook=null,melodyPulse=0;
let paddle={x:W/2,target:W/2,y:493,w:88};
let state='ready',resumeState='playing',kills=0,fleet=0,lives=5,combo=0,energy=0,rage=0,wide=0,laser=0,shield=1,regenClock=0,wingClock=0,missileClock=0,orbitalClock=0,orbitalFx=0,orbitalY=0,portalClock=0,portalFx=0,autoServe=0,laserClock=0,clock=0,shake=0,flash=0;
const thresholds=[0,12,28,52,80];
const MAX_PARTICLES=210,MAX_SHOTS=70,MAX_SHARDS=28;
function audio(k){fx.sound(k)}
function trans(en,zh,ja){const v=window.ArcadeLang?.get?.()||'en';return v==='zh-CN'?zh:v==='ja'?ja:en}
function resetSong(){songbook?.reset();melodyPulse=0;drops.length=0}
function melodyMiss(d){songbook?.miss(d);melodyPulse=.1}
function sonicBurst(){const x=paddle.x,y=paddle.y-32;laser=Math.max(laser,8);laserClock=0;shield=Math.min(3,shield+1);energy=Math.min(100,energy+22);for(let i=0;i<16;i++){const a=Math.PI*(.9+i/15*1.2);if(shards.length<MAX_SHARDS)shards.push({x,y,vx:Math.cos(a)*110,vy:-Math.abs(Math.sin(a)*130),trail:[],life:4})}for(const a of [-.42,.42])if(balls.length<11)spawnBall(x,y,Math.sin(a)*270,-Math.cos(a)*320);ring(x,y,'#ffe9b5',22);ring(W/2,250,'#8de8ff',26);burst(x,y,'#f3bbff',58);shake=10;flash=.36;text(W/2,308,trans('♪ SONIC SYMPHONY!','♪ 星河奏鸣！','♪ 星のシンフォニー！'),'#ffe7ad',22)}
function text(x,y,t,c='#c5f8ff',size=17){notices.push({x,y,t,c,size,age:0});if(notices.length>12)notices.shift()}
function burst(x,y,c,n=12){for(let i=0;i<n;i++){let a=rnd(0,Math.PI*2),v=rnd(35,160);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:rnd(.25,.75),c})}if(particles.length>MAX_PARTICLES)particles.splice(0,particles.length-MAX_PARTICLES)}

function setOverlay(title,desc,label){$('overlayTitle').textContent=title;$('overlayDesc').innerHTML=desc;$('start').textContent=label;$('overlay').hidden=false}
function updateUI(){
 $('kills').textContent=kills;$('fleet').textContent=fleet;$('balls').textContent=balls.length||'·';$('lives').textContent='♥'.repeat(lives)||'—';
 $('pause').textContent=state==='paused'?'▶ 继续':'Ⅱ 暂停';
 const next=fleet<4?thresholds[fleet+1]:thresholds[4],prev=thresholds[fleet];
 const ratio=fleet<4?clamp((kills-prev)/(next-prev),0,1):1;
 $('meterFill').style.width=String(ratio*100)+'%';$('meterPct').textContent=fleet<4?`${kills}/${next}`:'MAX';
 $('fleetBadge').textContent=['🛸 下一解锁：侦察机','🛸 单僚机 · 即将双机','🚀 双僚机 · 即将导弹','☄️ 导弹 · 即将轨道炮','🌌 舰队满编！'][fleet];
 $('rage').textContent=trans('♪ LIVE MELODY','♪ 即时演奏','♪ 生演奏')+(rage>0?' ⚡':'');
}
function cellBrick(row,col){let d=Math.random();return {r:row,c:col,x:MARGIN+col*(BW+GAP),y:65+row*26,w:BW,h:BH,alive:true,type:d<.09?'bomb':d<.17?'power':d<.23?'armor':'normal',hp:d>=.17&&d<.23?2:1,color:colors[row]}}
function addMissing(n){
 const occupied=new Set(bricks.filter(b=>b.alive).map(b=>b.r*COLS+b.c)),holes=[];
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!occupied.has(r*COLS+c))holes.push([r,c]);
 for(let i=holes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[holes[i],holes[j]]=[holes[j],holes[i]]}
 const count=Math.min(n,holes.length);for(let i=0;i<count;i++)bricks.push(cellBrick(...holes[i]));

}
function seedBricks(){bricks=[];addMissing(36)}
function nearest(x,y){let winner=null,best=Infinity;for(const b of bricks)if(b.alive){const dx=b.x+b.w/2-x,dy=b.y+b.h/2-y,d=dx*dx+dy*dy;if(d<best){best=d;winner=b}}return winner}
function spawnBall(x=paddle.x,y=paddle.y-15,vx=rnd(-145,145),vy=-rnd(265,315)){
 if(Math.abs(vx)<55)vx=vx<0?-95:95;if(balls.length<12)balls.push({x,y,vx,vy,r:5.5,trail:[],gateLock:0,bumperLock:0});

function aim(e){const box=C.getBoundingClientRect();paddle.target=clamp((e.clientX-box.left)*W/box.width,paddle.w/2+4,W-paddle.w/2-4);paddle.x=paddle.target}
let active=null;const wrap=$('field-wrap');
wrap.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();active=e.pointerId;try{wrap.setPointerCapture(active)}catch(_){}aim(e)});
wrap.addEventListener('pointermove',e=>{if(state==='playing'&&(e.pointerType==='mouse'||e.pointerId===active)){e.preventDefault();aim(e)}});
wrap.addEventListener('pointerup',e=>{if(e.pointerId===active)active=null});wrap.addEventListener('pointercancel',()=>active=null);
$('start').addEventListener('click',()=>state==='paused'?pause():reset());$('pause').addEventListener('click',pause);$('reset').addEventListener('click',reset);
$('sound').addEventListener('click',()=>{const m=fx.toggle();$('sound').textContent=['♫ 关','♫ 音乐','♪ 音效'][m];$('sound').classList.toggle('active',m>0);if(m)audio('power')});
document.addEventListener('keydown',e=>{if(e.target?.tagName==='BUTTON')return;if(e.code==='ArrowLeft'||e.code==='KeyA'){paddle.target-=26;e.preventDefault()}else if(e.code==='ArrowRight'||e.code==='KeyD'){paddle.target+=26;e.preventDefault()}else if(e.code==='Space'){pause();e.preventDefault()}});
songbook=window.NeonSongbook.create(fx,{onBar(){energy=Math.min(100,energy+12);shield=Math.min(3,shield+1);ring(W/2,240,'#aaf6ff',25);burst(W/2,260,'#9bd6ff',25);for(let i=0;i<5;i++){if(shards.length<MAX_SHARDS)shards.push({x:paddle.x,y:paddle.y-40,vx:(i-2)*40,vy:-160,trail:[],life:4})}text(W/2,335,trans('♪ BAR COMPLETE!','♪ 小节完成！','♪ 小節クリア！'),'#e2faff',18);},onSong(){sonicBurst();text(W/2,300,trans('♪ SONG COMPLETE!','♪ 全曲完成！','♪ 全曲完成！'),'#ffe9a0',23)},onChange(){drops=[];fx.tempo=window.NeonSongbook.songs.find(s=>s.id===$('songSelect').value)?.bpm||98;fx.update();}});fx.tempo=window.NeonSongbook.songs.find(s=>s.id===$('songSelect').value)?.bpm||98;document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});updateUI();raf=requestAnimationFrame(frame);
})();
