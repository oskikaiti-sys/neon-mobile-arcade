<style>

.header{display:flex;justify-content:space-between;align-items:center;flex:none}.micro{font-size:9px;letter-spacing:2px;color:#7fe9ff;font-weight:800}.title{font-size:clamp(18px,4.8vw,24px);font-weight:950;letter-spacing:1px}.title em{font-style:normal;color:#ff83bd}.minor{border:1px solid #335775;border-radius:11px;background:#19314b;color:#daefff;padding:8px 10px;font-size:12px;font-weight:850}

.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px;flex:none}.btn{border:1px solid #355879;border-radius:13px;background:#19314e;color:#e5f7ff;padding:13px 7px;font-size:13px;font-weight:900;min-height:50px;touch-action:manipulation}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45}.btn.rage{background:linear-gradient(110deg,#71375f,#9b4464);border-color:#b05e80;color:#ffe1ee}.btn.ready{background:linear-gradient(120deg,#fc578f,#ffb64f);color:#201326;animation:pulse .65s infinite alternate}@keyframes pulse{to{filter:brightness(1.25)}}.help{font-size:11px;color:#a2c6d8;line-height:1.6;text-align:center;flex:none}

<body><main id="app">
<header class="header"><div><div class="micro">MOBILE ARCADE · 02</div><div class="title">BREAKOUT <em>FEVER</em></div></div><button id="pause" class="minor">Ⅱ 暂停</button></header>
<section class="stats"><div class="stat"><span>SCORE</span><b id="score" style="color:#69eaf5">0</b></div><div class="stat"><span>BEST</span><b id="best">0</b></div><div class="stat"><span>WAVE</span><b id="wave" style="color:#ffda76">1</b></div><div class="stat"><span>LIVES</span><b id="lives" style="color:#ff87bd">♥ ♥ ♥ ♥ ♥</b></div></section>
<section class="stage"><div id="field-wrap"><canvas id="field" width="360" height="540" aria-label="打砖块棋盘，按住任意位置左右拖动就能控制挡板"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="sig">✦</div><h2 id="overlayTitle">准备开砸！</h2><p id="overlayDesc">手指按住游戏区域，左右滑动控制挡板。<br>球会自动发射，不需要点击挡板。</p><button id="start" class="play">▶ 开始狂欢</button></div></div></div></section>
<section class="charge"><strong>⚡ FEVER</strong><div class="meter"><div id="meterFill"></div></div><span id="meterPct" class="pct">0%</span></section>
<nav class="controls"><button id="rage" class="btn rage" disabled>⚡ 能量蓄力中</button><button id="sound" class="btn">♫ 关</button><button id="reset" class="btn">↻ 重开</button></nav>
<div class="help">📱 在游戏区域任意高度左右滑动，无需追着挡板移动<br>蓝 M 多球 · 绿 W 加宽 · 紫 L 激光 · 金 S 护盾</div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),C=$('field'),g=C.getContext('2d'),W=360,H=540,colors=['#fc73a4','#ffb36e','#fee07a','#69e9bc','#6ed2ff','#ae8aff','#d88cfa'];
let bricks=[],balls=[],drops=[],shots=[],particles=[],notices=[];let paddle={x:180,target:180,y:490,w:86};let state='ready',score=0,best=0,wave=1,lives=5,energy=0,rage=0,combo=0,comboClock=0,wide=0,laser=0,shield=1,laserClock=0,serve=0,between=0,shake=0,flash=0,clock=0,sound=false,ctxAudio=null;
try{best=Number(localStorage.getItem('breakoutFeverBest'))||0}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(value,low,high)=>Math.max(low,Math.min(high,value));
function audio(f=440,d=.06){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!ctxAudio)ctxAudio=new A();if(ctxAudio.state==='suspended')ctxAudio.resume();const o=ctxAudio.createOscillator(),v=ctxAudio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,ctxAudio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,f*.65),ctxAudio.currentTime+d);v.gain.setValueAtTime(.025,ctxAudio.currentTime);v.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+d);o.connect(v);v.connect(ctxAudio.destination);o.start();o.stop(ctxAudio.currentTime+d+.02)}catch(e){}}
function addPoints(v){score+=v;if(score>best){best=score;try{localStorage.setItem('breakoutFeverBest',best)}catch(e){}}}
function updateUI(){$('score').textContent=score.toLocaleString();$('best').textContent=best.toLocaleString();$('wave').textContent=wave;$('lives').textContent='♥ '.repeat(Math.max(0,lives)).trim()||'—';$('meterFill').style.width=(rage>0?100:energy)+'%';$('meterPct').textContent=rage>0?Math.ceil(rage)+'s':Math.floor(energy)+'%';const ready=energy>=100&&state==='playing'&&rage<=0;$('rage').disabled=!ready;$('rage').classList.toggle('ready',ready);$('rage').textContent=rage>0?'⚡ 狂暴中 '+Math.ceil(rage)+'s':ready?'⚡ 释放狂暴！':'⚡ 能量蓄力中';$('pause').textContent=state==='paused'?'▶ 继续':'Ⅱ 暂停'}
function makeWave(){bricks=[];let rows=Math.min(7,5+(wave-1)%3),cols=8,gap=4,margin=11,bw=(W-margin*2-gap*(cols-1))/cols;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let dice=Math.random();bricks.push({x:margin+c*(bw+gap),y:65+r*26,w:bw,h:19,color:colors[r],type:dice<.11?'bomb':dice<.20?'power':dice<.28?'armor':'normal',hp:dice>=.20&&dice<.28?2:1,alive:true})}}
function show(t,d,b){$('overlayTitle').textContent=t;$('overlayDesc').innerHTML=d;$('start').textContent=b;$('overlay').hidden=false}
function ball(){balls.push({x:paddle.x,y:paddle.y-16,vx:rnd(-145,145),vy:-rnd(245,285),r:5.6,trail:[]})}
function start(){state='playing';score=0;wave=1;lives=5;energy=0;rage=0;combo=0;comboClock=0;wide=0;laser=0;shield=1;laserClock=0;serve=0;between=0;shake=0;flash=0;particles=[];notices=[];shots=[];drops=[];balls=[];paddle.x=180;paddle.target=180;paddle.w=86;makeWave();ball();$('overlay').hidden=true;updateUI()}
function pause(){if(state==='paused'){state=pausedFrom;$('overlay').hidden=true;updateUI();return}if(!['playing','serving','between'].includes(state))return;pausedFrom=state;state='paused';show('已暂停','当前局面已保留。','▶ 继续');updateUI()}
let pausedFrom='playing';
function end(){state='over';show('GAME OVER',`得分 <strong style="color:#68eeff;font-size:20px">${score.toLocaleString()}</strong><br>闯到第 ${wave} 波！`,'↻ 再玩一局');updateUI()}
function burst(x,y,c,n=13){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(35,170);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(.3,.78),c})}if(particles.length>240)particles.splice(0,particles.length-240)}
function notice(x,y,t,c='#fff'){notices.push({x,y,t,c,age:0})}
function drop(x,y){const ts=['multi','wide','laser','shield'];drops.push({x,y,type:ts[Math.floor(Math.random()*ts.length)],vy:85})}
function destroy(b,chain=false){if(!b.alive)return;b.alive=false;const x=b.x+b.w/2,y=b.y+b.h/2;addPoints((chain?15:10)*(1+Math.floor(Math.min(combo,14)/4)));combo++;comboClock=2.3;energy=Math.min(100,energy+(rage>0?1:3.6));burst(x,y,b.color,b.type==='bomb'?24:11);shake=Math.min(7,shake+1);flash=Math.min(.24,flash+.035);if(b.type==='power'||Math.random()<.08)drop(x,y);if(b.type==='bomb'){notice(x,y,'BOOM!','#ff8fbd');shake=9;flash=.23;for(const other of bricks)if(other.alive&&Math.hypot(other.x+other.w/2-x,other.y+other.h/2-y)<58){other.alive=false;addPoints(20);burst(other.x+other.w/2,other.y+other.h/2,other.color,8)}}if(combo>0&&combo%8===0)notice(x,y,'×'+(1+Math.floor(combo/4))+' COMBO','#ffe39a');audio(400+Math.min(19,combo)*21);if(bricks.every(b=>!b.alive)&&state==='playing'){state='between';between=1.1;shots=[];notice(W/2,H*.46,'WAVE CLEAR!','#ffdd83');audio(1000,.19)}}
function hitBrick(b){if(!b.alive)return;if(b.hp>1){b.hp--;burst(b.x+b.w/2,b.y+b.h/2,'#e1eafc',5);audio(300)}else destroy(b)}
function getDrop(p){if(p.type==='multi'){const copy=balls.slice(0,2);for(const b of copy){if(balls.length>=9)break;const s=Math.max(270,Math.hypot(b.vx,b.vy)),a=Math.atan2(b.vy,b.vx);for(const off of [-.48,.48]){if(balls.length>=9)break;balls.push({x:b.x,y:b.y,vx:Math.cos(a+off)*s,vy:Math.sin(a+off)*s,r:5.6,trail:[]})}}}else if(p.type==='wide'){paddle.w=138;wide=13}else if(p.type==='laser'){laser=12;laserClock=0}else shield=Math.min(shield+1,3);energy=Math.min(100,energy+8);burst(p.x,p.y,{multi:'#6acbff',wide:'#63ebb6',laser:'#d59aff',shield:'#ffdb83'}[p.type],22);notice(p.x,p.y,{multi:'MULTIBALL!',wide:'WIDE!',laser:'LASER!',shield:'SHIELD!'}[p.type],'#e2f8ff');audio(840,.13)}
function activate(){if(energy<100||state!=='playing'||rage>0)return;rage=9;energy=0;laserClock=0;flash=.28;notice(W/2,H*.6,'⚡ FEVER MODE','#ffabde');audio(970,.25);updateUI()}
function step(dt){clock+=dt;shake=Math.max(0,shake-19*dt);flash=Math.max(0,flash-.9*dt);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;if(p.t>=p.life)particles.splice(i,1)}for(let i=notices.length-1;i>=0;i--){const n=notices[i];n.age+=dt;n.y-=25*dt;if(n.age>1)notices.splice(i,1)}if(state==='paused'||state==='ready'||state==='over')return;
 // Paddle is moved directly on pointer input; no drag latency.
 if(state==='between'){between-=dt;if(between<=0){wave++;lives=Math.min(6,lives+1);makeWave();balls=[];drops=[];shots=[];serve=.5;state='serving';notice(W/2,280,'WAVE '+wave+' · +1 LIFE','#8debff')}updateUI();return}
 if(state==='serving'){serve-=dt;if(serve<=0){ball();state='playing'}updateUI();return}
 if(comboClock>0){comboClock-=dt;if(comboClock<=0)combo=0}
 if(wide>0){wide-=dt;if(wide<=0)paddle.w=86}
 if(laser>0)laser=Math.max(0,laser-dt);
 if(rage>0)rage=Math.max(0,rage-dt);
 if(laser>0||rage>0){laserClock-=dt;if(laserClock<=0){laserClock=rage>0?.14:.28;for(const sign of [-1,1])shots.push({x:paddle.x+sign*(paddle.w/2-12),y:paddle.y-10})}}
 for(let i=drops.length-1;i>=0;i--){const p=drops[i];p.y+=p.vy*dt;if(p.y>paddle.y-10&&p.y<paddle.y+20&&Math.abs(p.x-paddle.x)<paddle.w/2+12){getDrop(p);drops.splice(i,1)}else if(p.y>H+10)drops.splice(i,1)}
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.y-=680*dt;let collision=false;for(const b of bricks)if(b.alive&&s.x>=b.x-2&&s.x<=b.x+b.w+2&&s.y>=b.y-8&&s.y<=b.y+b.h+4){hitBrick(b);collision=true;break}if(collision||s.y<42)shots.splice(i,1);if(state==='between')break}
 for(let i=balls.length-1;i>=0;i--){const b=balls[i],oldX=b.x,oldY=b.y;const k=rage>0?1.15:1;b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift();b.x+=b.vx*dt*k;b.y+=b.vy*dt*k;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<39+b.r){b.y=39+b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&oldY+b.r<=paddle.y+6&&b.y+b.r>=paddle.y&&Math.abs(b.x-paddle.x)<paddle.w/2+b.r){const offset=Math.max(-1,Math.min(1,(b.x-paddle.x)/(paddle.w/2)));let speed=Math.min(455,Math.max(285,Math.hypot(b.vx,b.vy)*1.025));b.vx=clamp(offset*speed*.83,-speed*.85,speed*.85);if(Math.abs(b.vx)<40)b.vx=b.vx<0?-45:45;b.vy=-Math.sqrt(Math.max(11000,speed*speed-b.vx*b.vx));b.y=paddle.y-b.r-1;burst(b.x,paddle.y,'#72e5ff',4);audio(250+Math.abs(offset)*200,.05)}if(b.y>H-16&&shield>0&&b.vy>0){b.y=H-24;b.vy=-Math.abs(b.vy);shield--;burst(b.x,H-16,'#ffe09a',16);audio(650,.13)}if(b.y>H+10){balls.splice(i,1);continue}for(const brick of bricks){if(!brick.alive)continue;const px=clamp(b.x,brick.x,brick.x+brick.w),py=clamp(b.y,brick.y,brick.y+brick.h);if((b.x-px)**2+(b.y-py)**2<b.r**2){if(oldY+b.r<=brick.y||oldY-b.r>=brick.y+brick.h){b.vy=-b.vy;b.y=oldY}else{b.vx=-b.vx;b.x=oldX}hitBrick(brick);break}}if(state==='between')break}
 if(state==='playing'&&balls.length===0){lives--;if(lives<=0)end();else{state='serving';serve=.8;combo=0;notice(W/2,390,'自动发球','#b2d9fa');audio(190,.17)}}updateUI()}
function round(x,y,w,h,r,fill){if(w<0||h<0)return;g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill()}
function draw(){g.clearRect(0,0,W,H);const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#12213e');bg.addColorStop(1,'#08192b');g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.strokeStyle='#ffffff0b';for(let x=0;x<=W;x+=24){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<=H;y+=24){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.fillStyle='#94b8d1';g.font='bold 10px system-ui';g.fillText('✦ ARCADE ZONE',12,23);g.textAlign='right';g.fillStyle='#ffd498';g.fillText('WAVE '+wave,W-12,23);g.restore();g.save();if(shake>0)g.translate(rnd(-shake,shake),rnd(-shake,shake));if(rage>0){g.fillStyle='#ef50b310';g.fillRect(0,38,W,H-38)}for(const b of bricks)if(b.alive){g.save();g.shadowColor=b.type==='bomb'?'#ff5fa7':b.color;g.shadowBlur=7;round(b.x,b.y,b.w,b.h,5,b.type==='bomb'?'#ff5294':b.type==='armor'?'#9ea9f1':b.color);g.shadowBlur=0;round(b.x+3,b.y+2,b.w-6,3,1,'#ffffff60');if(b.type==='bomb'||b.type==='power'){g.fillStyle='#fff';g.font='bold 13px system-ui';g.textAlign='center';g.fillText(b.type==='bomb'?'✸':'✦',b.x+b.w/2,b.y+14)}else if(b.type==='armor'){g.strokeStyle='#e8ebff';g.strokeRect(b.x+5,b.y+5,b.w-10,b.h-10)}g.restore()}
 for(const p of drops){const c={multi:'#64cbff',wide:'#70eeb3',laser:'#d39eff',shield:'#ffd981'}[p.type];g.save();g.shadowColor=c;g.shadowBlur=14;round(p.x-11,p.y-11,22,22,6,c);g.shadowBlur=0;g.fillStyle='#132944';g.font='900 13px system-ui';g.textAlign='center';g.fillText({multi:'M',wide:'W',laser:'L',shield:'S'}[p.type],p.x,p.y+5);g.restore()}
 for(const s of shots){g.save();g.shadowColor='#ffb3e2';g.shadowBlur=10;round(s.x-2,s.y-15,4,17,2,rage>0?'#ffd997':'#ef8bd7');g.restore()}
 for(const p of particles){g.globalAlpha=Math.max(0,1-p.t/p.life);g.fillStyle=p.c;g.fillRect(p.x,p.y,3.2,3.2)}g.globalAlpha=1;
 if(shield>0){g.save();g.strokeStyle='#ffdb90';g.shadowColor='#ffc063';g.shadowBlur=16;g.lineWidth=3;g.beginPath();g.moveTo(12,H-18);g.lineTo(W-12,H-18);g.stroke();g.restore()}
 for(const b of balls){for(let i=0;i<b.trail.length;i++){g.globalAlpha=(i+1)/b.trail.length*.4;const tr=b.trail[i];g.beginPath();g.arc(tr.x,tr.y,3.5*(i+1)/b.trail.length,0,Math.PI*2);g.fillStyle=rage>0?'#ff8ec7':'#66ddff';g.fill()}g.globalAlpha=1;g.save();g.shadowColor=rage>0?'#ff9fd8':'#74eaff';g.shadowBlur=18;g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fillStyle='#f4feff';g.fill();g.restore()}
 if(state==='ready'||state==='serving'){g.beginPath();g.arc(paddle.x,paddle.y-14,5.6,0,Math.PI*2);g.fillStyle='#dcfcff';g.fill()}
 g.save();g.shadowColor=rage>0?'#ff8cd5':'#55ebff';g.shadowBlur=17;const grad=g.createLinearGradient(0,paddle.y,0,paddle.y+14);grad.addColorStop(0,rage>0?'#ffe1aa':'#dcffff');grad.addColorStop(1,rage>0?'#ff63ad':'#40c6ed');round(paddle.x-paddle.w/2,paddle.y,paddle.w,13,7,grad);g.restore();
 for(const n of notices){g.save();g.textAlign='center';g.font='900 21px system-ui';g.globalAlpha=Math.max(0,1-n.age);g.shadowColor=n.c;g.shadowBlur=14;g.fillStyle=n.c;g.fillText(n.t,n.x,n.y);g.restore()}if(flash>0){g.fillStyle=`rgba(255,189,224,${flash*.55})`;g.fillRect(0,36,W,H-36)}g.restore()}
let last=0,raf;function frame(t){if(!document.body.contains(C)){cancelAnimationFrame(raf);return}const dt=Math.min(.035,(t-last)/1000||.016);last=t;const sub=Math.max(1,Math.ceil(dt/(1/120)));for(let i=0;i<sub;i++)step(dt/sub);draw();raf=requestAnimationFrame(frame)}
function aim(e){const rect=C.getBoundingClientRect();paddle.target=Math.max(paddle.w/2+3,Math.min(W-paddle.w/2-3,(e.clientX-rect.left)*W/rect.width));paddle.x=paddle.target}
let pid=null;const wrap=$('field-wrap');wrap.addEventListener('pointerdown',e=>{if(state==='playing'||state==='serving'||state==='between'){e.preventDefault();pid=e.pointerId;try{wrap.setPointerCapture(pid)}catch(_e){}aim(e)}});wrap.addEventListener('pointermove',e=>{if((pid===e.pointerId||e.pointerType==='mouse')&&['playing','serving','between'].includes(state)){e.preventDefault();aim(e)}});wrap.addEventListener('pointerup',e=>{if(pid===e.pointerId)pid=null});wrap.addEventListener('pointercancel',()=>pid=null);
$('start').addEventListener('click',()=>state==='paused'?pause():start());$('pause').addEventListener('click',pause);$('reset').addEventListener('click',start);$('rage').addEventListener('click',activate);$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'♫ 开':'♫ 关';audio(750,.1)});
document.addEventListener('keydown',e=>{if(e.target?.tagName==='BUTTON')return;if(['ArrowLeft','KeyA'].includes(e.code)){paddle.x=Math.max(paddle.w/2+4,paddle.x-23);e.preventDefault()}if(['ArrowRight','KeyD'].includes(e.code)){paddle.x=Math.min(W-paddle.w/2-4,paddle.x+23);e.preventDefault()}if(e.code==='Space'){pause();e.preventDefault()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['playing','between','serving'].includes(state))pause()});updateUI();raf=requestAnimationFrame(frame);
})();
</script></body></html>
