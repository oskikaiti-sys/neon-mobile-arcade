name: Install Conte de Fees sound effects
on:
  push:
    paths:
      - '.github/workflows/install-moonlit-sfx.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download selected licensed sound effects for embedded game use
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p moonlit-village/assets/audio/sfx
          for pair in \
            'cursor:cursor_04' \
            'confirm:confirm_01' \
            'cancel:cancel_01' \
            'damage:damage_01' \
            'chime:chime_04' \
            'gameover:gameover_07'
          do
            label="${pair%%:*}"
            stem="${pair##*:}"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 75 \
              -H 'Referer: https://conte-de-fees.com/se/' \
              -H 'User-Agent: Mozilla/5.0' \
              "https://conte-de-fees.com/se/cute/${stem}.mp3" \
              --output "moonlit-village/assets/audio/sfx/${label}.mp3"
            test "$(wc -c < "moonlit-village/assets/audio/sfx/${label}.mp3")" -gt 500
            file "moonlit-village/assets/audio/sfx/${label}.mp3"
          done
      - name: Commit embedded audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moonlit-village/assets/audio/sfx/
          if ! git diff --cached --quiet; then
            git commit -m 'Add licensed Conte de Fees soft UI and event sound effects'
            git push origin HEAD:main
          fi
